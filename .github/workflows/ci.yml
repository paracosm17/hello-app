name: Hello app CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_DIR: examples/hello-app

jobs:
  test:
    name: Application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run application tests
        run: python3 -m unittest discover -s "${APP_DIR}" -p 'test_*.py'

  build:
    name: Build pull request image
    if: github.event_name == 'pull_request'
    needs:
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Generate immutable image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          pull: true
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  publish:
    name: Publish main image
    if: github.event_name == 'push'
    needs:
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.image_ref.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Export immutable image reference
        id: image_ref
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_name="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          image_ref="${image_name}@${IMAGE_DIGEST}"
          printf 'value=%s\n' "${image_ref}" >> "${GITHUB_OUTPUT}"
          printf 'Published immutable image: `%s`\n' "${image_ref}" >> "${GITHUB_STEP_SUMMARY}"

  verify-published:
    name: Verify published image by digest
    if: github.event_name == 'push'
    needs:
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR for immutable pull
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the exact published digest
        shell: bash
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_REF}" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]]
          docker pull "${IMAGE_REF}"

      - name: Run immutable image smoke test
        shell: bash
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          set -euo pipefail
          container_name="solo-vps-ghcr-verify-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --pull never \
            --name "${container_name}" \
            --publish 127.0.0.1:18080:8080 \
            "${IMAGE_REF}"

          for attempt in {1..30}; do
            if response="$(curl --fail --silent --show-error http://127.0.0.1:18080/healthz 2>/dev/null)" \
              && [[ "${response}" == '{"status":"ok"}' ]]; then
              printf 'Immutable image healthcheck passed on attempt %s.\n' "${attempt}"
              exit 0
            fi
            sleep 1
          done

          docker logs "${container_name}" || true
          printf '%s\n' 'ERROR: immutable GHCR image did not satisfy /healthz contract' >&2
          exit 1